name: release

# Push a semver tag (git tag v0.1.0 && git push origin v0.1.0) to publish a
# release: the image goes to GHCR, and the GitHub release is created with the
# SBOM and CLI binaries attached. Publishing a release from the UI creates the
# tag, which runs this the same way. Running the workflow by hand with a
# `version` input releases the commit it runs on and creates that tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0 (the tag is created on the selected ref)"
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the SBOM to the release
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::version must look like v1.2.3, got $VERSION"; exit 1; }

      - uses: actions/checkout@v7

      # No QEMU: the Dockerfile's builder stage runs on the host platform and
      # cross-compiles with GOOS/GOARCH, and the runtime stage is FROM scratch,
      # so nothing executes under emulation.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # zstd-compressed layers (requires OCI media types).
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=19,force-compression=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          sbom: true
          provenance: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: qbo-bq-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Creates the release (or updates the one published from the UI).
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: qbo-bq-image.spdx.json

  binaries:
    name: Build CLI binaries
    needs: image # attach to the release the image job created
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the binaries to the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Go embeds module versions in the binary (`go version -m qbo-bq`), so no
      # extra tooling is needed for an auditable build.
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/qbo-bq-$os-$arch" ./cmd/qbo-bq
          done
          (cd dist && sha256sum qbo-bq-* > SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*
