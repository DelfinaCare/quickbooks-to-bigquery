name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qbo
          POSTGRES_PASSWORD: qbo
          POSTGRES_DB: qbo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qbo" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://qbo:qbo@localhost:5432/qbo?sslmode=disable
      - run: docker build -t qbo-bq:ci .
      - run: docker run --rm qbo-bq:ci schema
      # Same cross-compiled multi-arch build as the release workflow, unpushed.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive terraform
      - run: terraform init -backend=false -input=false
        working-directory: terraform/examples/basic
      - run: terraform validate
        working-directory: terraform/examples/basic
