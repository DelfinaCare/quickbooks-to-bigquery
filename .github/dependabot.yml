version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # The Google Cloud client libraries release often and in lockstep; one PR
    # for all minor/patch bumps keeps the noise down. Major bumps stay separate.
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images in the Dockerfile (golang builder).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
